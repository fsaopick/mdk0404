services:
  mysql:
    image: mysql:8.4
    container_name: time-app-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: time_db
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ppassword']
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./api
    container_name: time-app-api
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: time_db
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - '5555:5000'
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: time-app-frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - api

  adminer:
    image: adminer:4.8.1
    container_name: time-app-adminer
    restart: unless-stopped
    ports:
      - '8081:8080'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
