services:
  mysql:
    image: mysql:8.4
    container_name: myproj-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: guestbook_db
    ports:
      - '3310:3306'
    volumes:
      - myproj_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ppassword']
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./api
    container_name: myproj-api
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: guestbook_db
      CLIENT_ORIGIN: http://localhost:8090
    ports:
      - '5560:5000'
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: myproj-frontend
    restart: unless-stopped
    ports:
      - '8090:80'
    depends_on:
      - api

  adminer:
    image: adminer:4.8.1
    container_name: myproj-adminer
    restart: unless-stopped
    ports:
      - '8091:8080'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  myproj_mysql_data:
